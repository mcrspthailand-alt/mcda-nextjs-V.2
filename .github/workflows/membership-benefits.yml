name: Membership benefits
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  benefits:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mcda_test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: mcda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcda_test -d mcda_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MCDA_BENEFITS_TEST_DATABASE_URL: postgresql://mcda_test:disposable-ci-only@localhost:5432/mcda_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install
      - name: Unit, HTTP and real PostgreSQL race/rollback tests
        run: node --test tests/benefits-unit.test.mjs tests/benefits-postgres.test.mjs
