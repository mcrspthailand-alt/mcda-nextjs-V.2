name: Advisor Production Diagnostic
on:
  push:
    branches: [diag/advisor-health-20261108]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Advisor health
        run: |
          set -euxo pipefail
          curl --fail-with-body --silent --show-error --max-time 30 \
            https://mcda-decision-analysis.micro-support.com/api/health/advisor
          echo
      - name: Advisor smoke pipeline
        run: |
          set -euxo pipefail
          curl --fail-with-body --silent --show-error --max-time 120 \
            https://mcda-decision-analysis.micro-support.com/api/health/advisor/smoke \
            -o advisor-smoke.json
          cat advisor-smoke.json
          echo
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('advisor-smoke.json','utf8'));
          if(x.ok!==true) throw new Error('smoke not ok: '+JSON.stringify(x));
          if(Math.abs((x.entropy?.weightsSum ?? 0)-1)>1e-6) throw new Error('entropy sum invalid');
          if(!Array.isArray(x.mcda?.advisors)||x.mcda.advisors.length!==5) throw new Error('expected five MCDA advisors');
          console.log('SMOKE_ASSERTIONS=PASS');
          NODE
      - name: Main health
        run: |
          set -euxo pipefail
          curl --fail-with-body --silent --show-error --max-time 30 \
            https://mcda-decision-analysis.micro-support.com/api/health
          echo
      - name: Advisor end-to-end smoke
        run: |
          set -euxo pipefail
          status=$(curl --silent --show-error --max-time 120 \
            -D /tmp/advisor-headers.txt \
            -o /tmp/advisor-body.txt \
            -w "%{http_code}" \
            https://mcda-decision-analysis.micro-support.com/api/health/advisor/smoke)
          echo "HTTP_STATUS=$status"
          echo "--- HEADERS ---"
          cat /tmp/advisor-headers.txt
          echo "--- BODY ---"
          cat /tmp/advisor-body.txt
          echo
          test "$status" = "200"

# rerun after remote-gate fix

