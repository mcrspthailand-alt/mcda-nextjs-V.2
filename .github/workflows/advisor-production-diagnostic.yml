name: Advisor Production Diagnostic
on:
  push:
    branches: [diag/advisor-health-20261108]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Advisor health
        run: |
          set -euxo pipefail
          curl --fail-with-body --silent --show-error --max-time 30 \
            https://mcda-decision-analysis.micro-support.com/api/health/advisor
          echo
      - name: Main health
        run: |
          set -euxo pipefail
          curl --fail-with-body --silent --show-error --max-time 30 \
            https://mcda-decision-analysis.micro-support.com/api/health
          echo
      - name: Advisor end-to-end smoke
        run: |
          set -euxo pipefail
          status=$(curl --silent --show-error --max-time 120 \
            -D /tmp/advisor-headers.txt \
            -o /tmp/advisor-body.txt \
            -w "%{http_code}" \
            https://mcda-decision-analysis.micro-support.com/api/health/advisor/smoke)
          echo "HTTP_STATUS=$status"
          echo "--- HEADERS ---"
          cat /tmp/advisor-headers.txt
          echo "--- BODY ---"
          cat /tmp/advisor-body.txt
          echo
          test "$status" = "200"

# rerun after remote-gate fix
