name: Advisor Production Diagnostic
on:
  push:
    branches: [diag/advisor-health-20261108]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Advisor health
        run: |
          set -euxo pipefail
          curl --fail-with-body --silent --show-error --max-time 30 \
            https://mcda-decision-analysis.micro-support.com/api/health/advisor
          echo
      - name: Main health
        run: |
          set -euxo pipefail
          curl --fail-with-body --silent --show-error --max-time 30 \
            https://mcda-decision-analysis.micro-support.com/api/health
          echo
      - name: Advisor end-to-end smoke
        continue-on-error: true
        run: |
          set -euxo pipefail
          curl --fail-with-body --silent --show-error --max-time 120 \
            https://mcda-decision-analysis.micro-support.com/api/health/advisor/smoke
          echo
      - name: Advisor smoke direct service port
        run: |
          set -euxo pipefail
          curl --fail-with-body --silent --show-error --max-time 120 \
            http://183.88.220.157:3045/api/health/advisor/smoke
          echo

