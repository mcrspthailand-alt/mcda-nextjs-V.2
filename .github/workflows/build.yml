name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public fixture values for the disposable CI container; never production credentials.
      AUTH_SECRET: ci-only-placeholder-secret-not-for-production
      AMS_SERVICE_CODE: mcda-ci-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Billing and AMS relay regression tests
        run: node --experimental-strip-types --test tests/checkout-errors.test.mjs tests/ams-relay.test.mjs tests/fresh-checkout.test.mjs tests/fresh-checkout-http.test.mjs tests/membership-config.test.mjs tests/billing-prices.test.mjs tests/slip-price-channel.test.mjs

      - name: Navigation lifecycle regression tests
        run: node --experimental-strip-types --test tests/navigation-lifecycle.test.mjs

      - name: Build Next.js
        run: npm run build

      - name: Build Docker image
        run: docker build -t mcda-nextjs-v2:test .

      - name: Run Docker container
        run: docker run -d --name mcda-nextjs-v2 -p 3000:3000 -e AUTH_SECRET -e AMS_SERVICE_CODE mcda-nextjs-v2:test

      - name: Smoke test Docker container
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              echo "Container health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy"
          docker ps -a
          docker logs mcda-nextjs-v2
          exit 1

      - name: AMS webhook HTTP POST smoke test
        run: node tests/ams-relay-http-smoke.mjs

      - name: Install navigation browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium

      - name: Navigation browser regression
        run: node --experimental-strip-types tests/navigation-browser.mjs

      - name: Upload navigation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-screenshots
          path: test-results/navigation
          if-no-files-found: ignore

      - name: Cleanup Docker container
        if: always()
        run: docker rm -f mcda-nextjs-v2 || true
